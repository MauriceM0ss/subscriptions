{% extends "base.html" %}
{% block title %}Subscriptions{% endblock %}

{% block content %}
<div class="view-toolbar">
  <div class="view-title" id="view-title">Overview<span class="sub" id="view-sub"></span></div>
  <button class="btn-primary btn-sm" id="toolbar-add">＋ Add subscription</button>
</div>
<div id="view"></div>
{% endblock %}

{% block scripts %}
<script>
window.CURRENT = { scope: 'overview', id: null, label: 'Overview' };
const viewEl = document.getElementById('view');

document.getElementById('toolbar-add').addEventListener('click', () =>
  ['gaming', 'games', 'game-source'].includes(window.CURRENT.scope)
    ? window.openGameForm() : window.openSubForm());

// Switch the main view. Called by the sidebar (base.html) and internal links.
window.selectScope = function (scope, id, label) {
  window.CURRENT = { scope, id, label };
  document.getElementById('view-title').childNodes[0].nodeValue = label;
  // In the gaming view the primary action is adding a game, not a subscription.
  const addBtn = document.getElementById('toolbar-add');
  const gameScope = ['gaming', 'games', 'game-source'].includes(scope);
  addBtn.textContent = gameScope ? '＋ Add game' : '＋ Add subscription';
  highlightActive();
  renderView();
  if (window.closeSidebar) window.closeSidebar();
};

// Re-render whatever view is currently open (after edits, currency change, …).
window.reloadView = renderView;

async function renderView() {
  const c = window.CURRENT;
  viewEl.innerHTML = '<div class="view-loading">Loading…</div>';
  try {
    if (c.scope === 'overview') return renderOverview();
    if (c.scope === 'gaming') return renderGaming();
    if (c.scope === 'games' || c.scope === 'game-source') return renderGameList(c);
    if (c.scope === 'subscription') return renderDetail(c.id);
    return renderList(c);   // all | upcoming | category
  } catch (e) {
    viewEl.innerHTML = '<div class="empty-state"><div class="empty-title">Something went wrong</div></div>';
  }
}

function setSub(text) { document.getElementById('view-sub').textContent = text || ''; }

// ── Overview dashboard ────────────────────────────────────────────────────────
async function renderOverview() {
  const d = await (await fetch('/api/overview')).json();
  window.CURRENCY = d.currency || window.CURRENCY;
  setSub(`${d.active_count} active of ${d.total_count}`);

  if (!d.total_count) {
    viewEl.innerHTML = emptyState('overview');
    bindEmptyAdd();
    return;
  }

  const tiles = [
    { label: 'Per month', value: fmtMoney(d.monthly_total), hint: 'active subscriptions' },
    { label: 'Per year', value: fmtMoney(d.yearly_total), hint: 'active subscriptions' },
    { label: 'Active', value: d.active_count, hint: `${d.total_count} total` },
    { label: 'Spent so far', value: fmtMoney(d.total_spent),
      hint: d.one_time_count ? 'recurring only, estimated' : 'all subscriptions, estimated' },
  ];
  // Kept out of "Spent so far" on purpose, but shown so the money is not
  // invisible — one-time spend is real, it is just not a commitment.
  if (d.one_time_count) {
    tiles.push({ label: 'One-time', value: fmtMoney(d.one_time_spent),
                 hint: `${d.one_time_charges} month${d.one_time_charges === 1 ? '' : 's'} used` });
  }

  const upcoming = d.upcoming.length ? d.upcoming.map(s => `
    <div class="up-row ${renewClass(s.days_until_renew)}" data-id="${s.id}">
      <span class="up-when">${renewLabel(s.days_until_renew)}</span>
      <span class="up-name">${escHtml(s.name)}${s.category_name ? ` <span class="muted-text">· ${escHtml(s.category_name)}</span>` : ''}</span>
      <span class="up-date">${fmtDate(s.next_renewal)}</span>
      <span class="up-amt">${fmtMoney(s.amount)}<span class="muted-text">/${s.billing_cycle === 'yearly' ? 'yr' : 'mo'}</span></span>
    </div>`).join('') : '<div class="muted-text" style="padding:8px 2px">No upcoming renewals.</div>';

  const byCat = d.by_category.length ? d.by_category.map(c => {
    const pct = d.monthly_total ? Math.round((c.monthly / d.monthly_total) * 100) : 0;
    return `<div class="bar-row">
        <span class="bar-label">${escHtml(c.name)}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
        <span class="bar-val">${fmtMoney(c.monthly)}<span class="muted-text">/mo</span></span>
      </div>`;
  }).join('') : '';

  viewEl.innerHTML = `
    <div class="stat-grid">
      ${tiles.map(t => `<div class="stat-tile">
        <div class="stat-label">${t.label}</div>
        <div class="stat-value">${t.value}</div>
        <div class="stat-hint">${t.hint}</div>
      </div>`).join('')}
    </div>
    <div class="overview-cols">
      <section class="panel">
        <h3 class="panel-title">Upcoming renewals</h3>
        <div class="up-list">${upcoming}</div>
      </section>
      ${byCat ? `<section class="panel">
        <h3 class="panel-title">Monthly spend by category</h3>
        <div class="bar-list">${byCat}</div>
      </section>` : ''}
    </div>`;

  viewEl.querySelectorAll('.up-row').forEach(r =>
    r.addEventListener('click', () => window.selectScope('subscription', Number(r.dataset.id), '')));
}

// ── Gaming overview ───────────────────────────────────────────────────────────
// What gaming actually costs: one-off game purchases and the subscriptions
// filed under Gaming, which are otherwise only ever reported apart.
async function renderGaming() {
  const d = await (await fetch('/api/gaming-overview')).json();
  window.CURRENCY = d.currency || window.CURRENCY;
  setSub(`${d.game_count} game${d.game_count === 1 ? '' : 's'}` +
         (d.sub_count ? ` · ${d.sub_count} subscription${d.sub_count === 1 ? '' : 's'}` : ''));

  if (!d.game_count && !d.sub_count) {
    viewEl.innerHTML = `<div class="empty-state"><div class="empty-icon">◈</div>
      <div class="empty-title">Nothing tracked yet</div>
      <div class="empty-sub">Add a game you have bought, or file a subscription under Gaming.<br><br>
        <button class="btn-primary btn-sm empty-add">＋ Add your first game</button></div></div>`;
    bindEmptyAdd();
    return;
  }

  const tiles = [
    { label: 'All gaming', value: fmtMoney(d.total_spent), hint: 'games + subscriptions' },
    { label: 'Games', value: fmtMoney(d.games_spent), hint: `${d.game_count} bought` },
    { label: 'Average game', value: fmtMoney(d.avg_price), hint: 'per purchase' },
  ];
  if (d.sub_count) {
    tiles.push({ label: 'Gaming subs', value: fmtMoney(d.sub_spent),
                 hint: d.sub_monthly ? `${fmtMoney(d.sub_monthly)}/mo active` : 'none active' });
  }

  const maxSource = Math.max(1, ...d.by_source.map(x => x.spent));
  const bySource = d.by_source.length ? d.by_source.map(x => `
    <div class="bar-row">
      <span class="bar-label">${escHtml(x.name)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.round((x.spent / maxSource) * 100)}%"></span></span>
      <span class="bar-val">${fmtMoney(x.spent)}</span>
    </div>`).join('') : '<div class="muted-text" style="padding:8px 2px">No purchases yet.</div>';

  const maxYear = Math.max(1, ...d.by_year.map(x => x.spent));
  const byYear = d.by_year.length ? d.by_year.map(x => `
    <div class="bar-row">
      <span class="bar-label">${escHtml(x.year)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.round((x.spent / maxYear) * 100)}%"></span></span>
      <span class="bar-val">${fmtMoney(x.spent)}</span>
    </div>`).join('') : '';

  const games = d.recent.length ? d.recent.map(g => `
    <div class="up-row game-row" data-game-id="${g.id}">
      <span class="up-name">${escHtml(g.name)}${g.source ? ` <span class="muted-text">· ${escHtml(g.source)}</span>` : ''}</span>
      <span class="up-date">${g.purchased_on ? fmtDate(g.purchased_on) : '<span class="muted-text">date unknown</span>'}</span>
      <span class="up-amt">${fmtMoney(g.price)}</span>
    </div>`).join('') : '<div class="muted-text" style="padding:8px 2px">No games yet.</div>';

  viewEl.innerHTML = `
    <div class="stat-grid">
      ${tiles.map(t => `<div class="stat-tile">
        <div class="stat-label">${t.label}</div>
        <div class="stat-value">${t.value}</div>
        <div class="stat-hint">${t.hint}</div>
      </div>`).join('')}
    </div>
    <div class="overview-cols">
      <section class="panel">
        <h3 class="panel-title">Recent purchases</h3>
        <div class="up-list">${games}</div>
      </section>
      <section class="panel">
        <h3 class="panel-title">Spend by store</h3>
        <div class="bar-list">${bySource}</div>
        ${byYear ? `<h3 class="panel-title" style="margin-top:18px">Spend by year</h3>
        <div class="bar-list">${byYear}</div>` : ''}
      </section>
    </div>`;

  viewEl.querySelectorAll('.game-row').forEach(r => r.addEventListener('click', async () => {
    const list = await (await fetch('/api/games')).json();
    const g = (list.items || []).find(x => String(x.id) === r.dataset.gameId);
    if (g) window.openGameForm(g);
  }));
}

// ── Game library (all games | one store) ──────────────────────────────────────
async function renderGameList(c) {
  const url = c.scope === 'game-source'
    ? '/api/games/by-source/' + encodeURIComponent(c.id)
    : '/api/games';
  const d = await (await fetch(url)).json();
  window.CURRENCY = d.currency || window.CURRENCY;
  const items = d.items || [];
  setSub(`${items.length} game${items.length === 1 ? '' : 's'}`);

  if (!items.length) {
    viewEl.innerHTML = `<div class="empty-state"><div class="empty-icon">◈</div>
      <div class="empty-title">No games here yet</div>
      <div class="empty-sub"><button class="btn-primary btn-sm empty-add">＋ Add a game</button></div></div>`;
    bindEmptyAdd();
    return;
  }

  viewEl.innerHTML =
    `<div class="list-summary">${fmtMoney(d.spent)}<span class="muted-text">&nbsp;spent across ${items.length} purchase${items.length === 1 ? '' : 's'}</span></div>` +
    '<div class="sub-list">' + items.map(gameCard).join('') + '</div>';
  viewEl.querySelectorAll('.sub-card').forEach(el =>
    el.addEventListener('click', () => {
      const g = items.find(x => String(x.id) === el.dataset.id);
      if (g) window.openGameForm(g);
    }));
}

function gameCard(g) {
  const notes = g.notes ? `<span class="meta-sep note-sep">·</span><span class="game-note">${escHtml(g.notes.split(' | ')[0])}</span>` : '';
  return `<article class="sub-card" data-id="${g.id}">
    <div class="sub-card-main">
      <div class="sub-card-head"><span class="sub-card-name">${escHtml(g.name)}</span></div>
      <div class="sub-card-meta">
        <span class="cat-pill">${escHtml(g.source || 'Unknown')}</span>
        <span class="meta-sep">·</span>
        <span>${g.purchased_on ? fmtDate(g.purchased_on) : 'date unknown'}</span>
        ${notes}
      </div>
    </div>
    <div class="sub-card-cost"><div class="cost-primary">${fmtMoney(g.price)}</div></div>
  </article>`;
}

// ── List views (all | upcoming | category) ────────────────────────────────────
async function renderList(c) {
  const params = new URLSearchParams({ scope: c.scope });
  if (c.id != null) params.set('id', c.id);
  const d = await (await fetch('/api/subscriptions?' + params)).json();
  window.CURRENCY = d.currency || window.CURRENCY;
  const items = d.items || [];
  setSub(`${items.length} subscription${items.length === 1 ? '' : 's'}`);

  if (!items.length) { viewEl.innerHTML = emptyState(c.scope); bindEmptyAdd(); return; }

  const allOneTime = items.length && items.every(s => s.one_time);
  const monthly = items.filter(s => s.active && !s.one_time).reduce((a, s) => a + s.monthly_cost, 0);
  const spent = items.filter(s => s.one_time).reduce((a, s) => a + s.total_spent, 0);
  const summary = c.scope === 'upcoming' ? '' : (allOneTime
    ? `<div class="list-summary">${fmtMoney(spent)}<span class="muted-text">&nbsp;spent across all months used</span></div>`
    : `<div class="list-summary">${fmtMoney(monthly)}<span class="muted-text">/mo across active</span></div>`);

  viewEl.innerHTML = summary + '<div class="sub-list">' + items.map(subCard).join('') + '</div>';
  viewEl.querySelectorAll('.sub-card').forEach(el =>
    el.addEventListener('click', () => window.selectScope('subscription', Number(el.dataset.id), el.dataset.name)));
}

function subCard(s) {
  const renew = s.days_until_renew !== null && s.days_until_renew !== undefined
    ? `<span class="chip ${renewClass(s.days_until_renew)}">↻ ${renewLabel(s.days_until_renew)}</span>` : '';
  // A one-time subscription carries no monthly cost, so showing "0.00/mo"
  // would read as free. Show the per-use price and the running total instead.
  const cost = s.one_time
    ? `<div class="cost-primary">${fmtMoney(s.amount)}<span class="muted-text">/use</span></div>
       <div class="cost-secondary">${fmtMoney(s.total_spent)} over ${s.charges} month${s.charges === 1 ? '' : 's'}</div>`
    : `<div class="cost-primary">${fmtMoney(s.monthly_cost)}<span class="muted-text">/mo</span></div>
       <div class="cost-secondary">${fmtMoney(s.yearly_cost)}/yr</div>`;
  const meta = s.one_time
    ? '<span class="chip chip-onetime">one-time</span>'
    : `<span class="meta-sep">·</span><span>${s.billing_cycle}</span>${renew}`;
  const dim = (!s.one_time && !s.active) ? ' is-inactive' : '';
  return `<article class="sub-card${dim}" data-id="${s.id}" data-name="${escHtml(s.name)}">
    <div class="sub-card-main">
      <div class="sub-card-head">
        <span class="sub-card-name">${escHtml(s.name)}</span>
        ${dim ? '<span class="chip chip-muted">inactive</span>' : ''}
      </div>
      <div class="sub-card-meta">
        <span class="cat-pill">${escHtml(s.category_name || 'Uncategorized')}</span>
        ${meta}
      </div>
    </div>
    <div class="sub-card-cost">${cost}</div>
  </article>`;
}

// A coloured chip conveying how much you'd miss a subscription.
function necessityChip(nec) {
  if (!nec) return '<span class="muted-text">—</span>';
  const cls = { 'Nice to Have': 'nec-nice', 'Important': 'nec-important', 'Critical': 'nec-critical' }[nec] || 'nec-important';
  return `<span class="chip ${cls}">${escHtml(nec)}</span>`;
}

// Timeline of recorded prices (newest first), with the change vs the prior price.
function priceHistorySection(s) {
  const ph = s.price_history || [];
  if (!ph.length) return '';
  // Shown even with a single recorded price: an empty-looking panel is how you
  // learn the history exists and is being kept.
  if (ph.length === 1) {
    return `<section class="panel ph-panel">
      <h3 class="panel-title">Price history</h3>
      <div class="ph-list"><div class="ph-row">
        <span class="ph-date">${fmtDate(ph[0].changed_on)}</span>
        <span class="ph-amt">${fmtMoney(ph[0].amount)}<span class="muted-text">/${ph[0].billing_cycle === 'yearly' ? 'yr' : 'mo'}</span></span>
        <span class="ph-delta"><span class="muted-text">first price — no changes yet</span></span>
      </div></div>
    </section>`;
  }
  const rows = ph.slice().reverse().map((p, i, arr) => {
    const prev = arr[i + 1];                       // chronologically-earlier entry
    let delta = '';
    if (prev) {
      const diff = Math.round((p.amount - prev.amount) * 100) / 100;
      if (diff > 0) delta = `<span class="ph-up">▲ ${fmtMoney(diff)}</span>`;
      else if (diff < 0) delta = `<span class="ph-down">▼ ${fmtMoney(-diff)}</span>`;
    }
    const per = p.billing_cycle === 'yearly' ? 'yr' : 'mo';
    return `<div class="ph-row">
      <span class="ph-date">${fmtDate(p.changed_on)}</span>
      <span class="ph-amt">${fmtMoney(p.amount)}<span class="muted-text">/${per}</span></span>
      <span class="ph-delta">${delta}${prev ? '' : '<span class="muted-text">first price</span>'}</span>
    </div>`;
  }).join('');
  return `<section class="panel ph-panel">
    <h3 class="panel-title">Price history</h3>
    <div class="ph-list">${rows}</div>
  </section>`;
}

// Months a one-time subscription was actually switched on. Each row is a
// charge at the price that applied when it was logged.
function usageSection(s) {
  if (!s.one_time) return '';
  const rows = (s.usage || []).map(u => `<div class="ph-row usage-row" data-usage-id="${u.id}">
      <span class="ph-date">${fmtDate(u.charged_on)}</span>
      <span class="ph-amt">${fmtMoney(u.amount)}</span>
      <span class="ph-delta"><button class="usage-del" data-usage-id="${u.id}" title="Remove this month">✕</button></span>
    </div>`).join('');
  return `<section class="panel ph-panel">
    <h3 class="panel-title">Months used
      <span class="chip chip-muted">${s.charges}</span>
    </h3>
    <p class="settings-desc">Log a month each time you switch this on. Only these
      months are counted — nothing accrues while you are not using it.</p>
    <div class="ph-list">${rows || '<div class="muted-text" style="padding:8px 2px">No months logged yet.</div>'}</div>
    <div class="usage-actions">
      <button class="btn-primary btn-sm" id="usage-log">＋ Log a month (${fmtMoney(s.amount)})</button>
    </div>
  </section>`;
}

// ── Detail view ───────────────────────────────────────────────────────────────
async function renderDetail(id) {
  const s = await (await fetch('/api/subscriptions/' + id)).json();
  if (s.error) { viewEl.innerHTML = `<div class="empty-state"><div class="empty-title">${escHtml(s.error)}</div></div>`; return; }
  window.CURRENCY = s.currency || window.CURRENCY;
  document.getElementById('view-title').childNodes[0].nodeValue = s.name;
  window.CURRENT.label = s.name;
  setSub(s.category_name || 'Uncategorized');

  const renewRow = s.active
    ? `${fmtDate(s.next_renewal)} <span class="chip ${renewClass(s.days_until_renew)}">${renewLabel(s.days_until_renew)}</span>`
    : '<span class="muted-text">— paused</span>';
  // A one-time subscription has no cycle, start date or renewal — it is only
  // ever a price per month used, plus the months actually used.
  const rows = s.one_time ? [
    ['Category', escHtml(s.category_name || 'Uncategorized')],
    ['Price per month used', fmtMoney(s.amount)],
    ['Payment method', s.payment_method ? escHtml(s.payment_method) : '<span class="muted-text">—</span>'],
    ['Necessity', necessityChip(s.necessity)],
    ['Months used', `${s.charges}`],
    ['Total spent', `${fmtMoney(s.total_spent)} <span class="muted-text">(excluded from the overview totals)</span>`],
  ] : [
    ['Category', escHtml(s.category_name || 'Uncategorized')],
    ['Billing cycle', s.billing_cycle],
    ['Amount', `${fmtMoney(s.amount)} / ${s.billing_cycle === 'yearly' ? 'year' : 'month'}`],
    ['Monthly cost', fmtMoney(s.monthly_cost)],
    ['Yearly cost', fmtMoney(s.yearly_cost)],
    ['Payment method', s.payment_method ? escHtml(s.payment_method) : '<span class="muted-text">—</span>'],
    ['Necessity', necessityChip(s.necessity)],
    ['Start date', fmtDate(s.start_date)],
    ['Next renewal', renewRow],
    ['Total spent so far', `${fmtMoney(s.total_spent)} <span class="muted-text">(${s.charges} charge${s.charges === 1 ? '' : 's'})</span>`],
  ];

  const statusChip = s.one_time
    ? '<span class="chip chip-onetime">● One-time</span>'
    : (s.active ? '<span class="chip chip-ok">● Active</span>'
                : '<span class="chip chip-muted">● Inactive</span>');
  // One-time subscriptions have no on/off state to carry — the ticker is the
  // only thing that means anything, so the toggle would just mislead.
  const toggleBtn = s.one_time ? '' : (s.active
    ? '<button class="btn-secondary btn-sm" id="detail-toggle">Disable</button>'
    : '<button class="btn-primary btn-sm" id="detail-toggle">Enable</button>');

  viewEl.innerHTML = `
    <div class="detail-card">
      <div class="detail-head">
        <div class="detail-status">${statusChip}</div>
        <div class="detail-actions">
          ${toggleBtn}
          <button class="btn-secondary btn-sm" id="detail-edit">Edit</button>
          <button class="btn-danger-sm" id="detail-delete">Delete</button>
        </div>
      </div>
      <div class="detail-cost-row">
        ${s.one_time ? `
        <div class="detail-cost"><span class="dc-value">${fmtMoney(s.amount)}</span><span class="dc-label">per month used</span></div>
        <div class="detail-cost"><span class="dc-value">${s.charges}</span><span class="dc-label">month${s.charges === 1 ? '' : 's'} used</span></div>
        <div class="detail-cost"><span class="dc-value">${fmtMoney(s.total_spent)}</span><span class="dc-label">spent so far</span></div>
        ` : `
        <div class="detail-cost"><span class="dc-value">${fmtMoney(s.monthly_cost)}</span><span class="dc-label">per month</span></div>
        <div class="detail-cost"><span class="dc-value">${fmtMoney(s.yearly_cost)}</span><span class="dc-label">per year</span></div>
        <div class="detail-cost"><span class="dc-value">${fmtMoney(s.total_spent)}</span><span class="dc-label">spent so far</span></div>
        `}
      </div>
      <dl class="detail-list">
        ${rows.map(([k, v]) => `<div class="detail-row"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}
        ${s.notes ? `<div class="detail-row"><dt>Notes</dt><dd>${escHtml(s.notes)}</dd></div>` : ''}
      </dl>
      ${usageSection(s)}
      ${priceHistorySection(s)}
    </div>`;

  const logBtn = document.getElementById('usage-log');
  if (logBtn) logBtn.addEventListener('click', async () => {
    logBtn.disabled = true;
    await fetch(`/api/subscriptions/${s.id}/usage`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: '{}' });
    await window.loadTree();
    renderDetail(id);
  });
  viewEl.querySelectorAll('.usage-del').forEach(btn => btn.addEventListener('click', async () => {
    if (!await confirmDialog({ title: 'Remove this month?',
      message: 'This logged month will no longer count towards the total.',
      confirmLabel: 'Remove', danger: true })) return;
    btn.disabled = true;
    await fetch('/api/usage/' + btn.dataset.usageId, { method: 'DELETE' });
    await window.loadTree();
    renderDetail(id);
  }));

  const toggle = document.getElementById('detail-toggle');
  if (toggle) toggle.addEventListener('click', async () => {
    toggle.disabled = true;
    await fetch('/api/subscriptions/' + s.id, { method: 'PUT',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ active: !s.active }) });
    await window.loadTree();
    renderDetail(id);
  });
  document.getElementById('detail-edit').addEventListener('click', () => window.openSubForm(s));
  document.getElementById('detail-delete').addEventListener('click', async () => {
    if (!await window.confirmDialog({ title: 'Delete subscription',
      message: `Delete "${s.name}"? This can't be undone.`, confirmLabel: 'Delete', danger: true })) return;
    await fetch('/api/subscriptions/' + s.id, { method: 'DELETE' });
    await window.loadTree();
    window.selectScope('overview', null, 'Overview');
  });
}

// ── Empty states ──────────────────────────────────────────────────────────────
function emptyState(scope) {
  if (scope === 'upcoming')
    return `<div class="empty-state"><div class="empty-icon">↻</div>
      <div class="empty-title">No upcoming renewals</div>
      <div class="empty-sub">Renewals due soon will show up here.</div></div>`;
  if (scope === 'category')
    return `<div class="empty-state"><div class="empty-icon">≣</div>
      <div class="empty-title">No subscriptions in this category</div>
      <div class="empty-sub"><button class="btn-primary btn-sm empty-add">＋ Add subscription</button></div></div>`;
  return `<div class="empty-state"><div class="empty-icon">📄</div>
    <div class="empty-title">No subscriptions yet</div>
    <div class="empty-sub">Add the services you pay for to see what they cost.<br><br>
      <button class="btn-primary btn-sm empty-add">＋ Add your first subscription</button></div></div>`;
}
function bindEmptyAdd() {
  const b = viewEl.querySelector('.empty-add');
  if (!b) return;
  // The empty state appears in game views too, where the subscription form
  // would be the wrong thing to open.
  const gameScope = ['gaming', 'games', 'game-source'].includes(window.CURRENT.scope);
  b.addEventListener('click', () => gameScope ? window.openGameForm() : window.openSubForm());
}

// Boot
loadTree().then(() => selectScope('overview', null, 'Overview'));
</script>
